name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v
      - name: Run every example
        run: |
          for file in examples/*.dl; do
            echo "== $file"
            python -m datalog run "$file" --warn-undefined --stats
          done
      - name: Explain a fact from every example
        run: |
          python -m datalog explain 'allowed(alice, deploy, prod)' examples/access.dl
          python -m datalog explain 'ancestor(alice, dave)' examples/ancestors.dl
          python -m datalog explain 'reaches(a, e)' examples/graph.dl
          python -m datalog explain 'pointsTo(c, x)' examples/pointsto.dl --facts
          python -m datalog explain 'reaches(blue0, blue9)' examples/metro.dl --json > /dev/null
      - name: Diff a change against every example
        run: |
          python -m datalog diff examples/access.dl --remove 'memberOf(alice, admin)' --stats
          python -m datalog diff examples/ancestors.dl --remove 'parent(alice, bob)'
          python -m datalog diff examples/graph.dl --add 'edge(e, a, 1)' --only reaches
          python -m datalog diff examples/pointsto.dl --add 'assign(p, d)'
          python -m datalog diff examples/metro.dl --remove 'track(blue3, blue4)' --json > /dev/null

      - name: Check the package installs and the entry point works
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          datalog --version
          datalog run examples/ancestors.dl
          datalog explain 'ancestor(alice, dave)' examples/ancestors.dl
